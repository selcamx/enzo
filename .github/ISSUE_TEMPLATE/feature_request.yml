name: Feature Request
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        You can also suggest it from Enzo: choose **Help › Send Feedback…**
        in the menu bar. It files the issue here and can credit you by first name.
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      placeholder: Describe the feature or improvement you'd like.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      placeholder: How would this help your workflow?
    validations:
      required: false
