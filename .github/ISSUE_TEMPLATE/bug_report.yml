name: Bug Report
description: Report a bug in Enzo
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. The quickest way is from Enzo itself: choose **Help › Send Feedback…**
        in the menu bar. It files the issue here with your version and Mac,
        sends any diagnostics to us privately, and can credit you by first name.
  - type: input
    id: version
    attributes:
      label: Enzo version
      description: In the menu bar, choose Enzo › About Enzo.
      placeholder: "e.g. 2.0.5"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.6 or macOS 26.1"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Mac chip
      placeholder: "e.g. M4 Air, M1 Pro"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which part of Enzo?
      options:
        - Dictation
        - Meetings and recordings
        - Chat
        - The notch or island
        - Activity
        - People
        - Recall
        - Routines
        - Connections
        - Setup, sign-in or updates
        - Account or plan
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe what you expected vs what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Enzo
        2. ...
    validations:
      required: false
