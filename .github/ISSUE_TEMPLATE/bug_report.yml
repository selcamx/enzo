name: Bug Report
description: Report a bug in Enzo for Mac
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. The quickest way is right inside Enzo: choose **Help › Send Feedback…**
        in the menu bar. It files the issue here with your version and Mac details,
        sends sanitized diagnostics to us privately, and can credit you by first name.
  - type: input
    id: version
    attributes:
      label: Enzo version
      description: In the menu bar, choose Enzo › About Enzo.
      placeholder: "e.g. 2.0.9"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.6 or macOS 26.1"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Mac model / chip
      placeholder: "e.g. M4 MacBook Air, M2 Pro Mac mini"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which part of Enzo?
      options:
        - Dictation
        - Meetings and Speak (recordings)
        - Chat
        - Recall
        - Routines
        - People (voice profiles)
        - Connections (Mail, Calendar, etc.)
        - Notch, island, or Ghost mode
        - Setup, permissions, or updates
        - Account or billing
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe what you expected versus what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Enzo
        2. ...
    validations:
      required: false
